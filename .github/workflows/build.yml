# Builds both TV apps and checks the bridge on every push and pull request, so a change that
# breaks the build is seen straight away. The APKs it makes are test builds, signed with the
# runner's own throwaway key: they install on a TV that has no couch-tv yet, but cannot update one
# installed from the Releases page (Android refuses an update signed with a different key).
# Several forks added a build like this (fifarsi, ishanboss20, gurpritsingh81, herocode1).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bridge and tools compile
        run: python -m py_compile bridge/*.py scripts/*.py tv-home/tools/*.py

      - name: Shell scripts parse
        run: for f in scripts/*.sh tv-home/tools/*.sh; do sh -n "$f"; done

      - name: Android platform 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build the TV apps
        run: sh scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: couch-tv-test-apks
          path: dist/*.apk
          if-no-files-found: error
