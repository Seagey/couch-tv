# Builds both TV apps and checks the bridge on every push and pull request, so a change that
# breaks the build is seen straight away. The APKs it makes are test builds, signed with the
# runner's own throwaway key: they install on a TV that has no couch-tv yet, but cannot update one
# installed from the Releases page (Android refuses an update signed with a different key).
# With the DEBUG_KEYSTORE secret set, every test build is signed with that one fixed key, so a test
# build can update the previous test build (#4). Pull requests from forks never see the secret.
# Several forks added a build like this (fifarsi, ishanboss20, gurpritsingh81, herocode1).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bridge and tools compile
        run: python -m py_compile bridge/*.py scripts/*.py tv-home/tools/*.py sync/sync.py

      - name: Shell scripts parse
        # each with the shell its first line names (privacy-scan.sh is bash, the rest plain sh)
        run: for f in scripts/*.sh tv-home/tools/*.sh sync/*.sh; do if head -1 "$f" | grep -q bash; then bash -n "$f"; else sh -n "$f"; fi; done

      - name: Android platform 34
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Fixed test signing key (optional)
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            printf '%s' "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/ci.keystore"
            echo "COUCHTV_KEYSTORE=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build the TV apps
        run: sh scripts/build-apk.sh

      - name: Gradle cache
        # keep what was downloaded for the next run
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('on-tv/android/**/*.kts', 'on-tv/android/gradle/**', 'tv-home/android/**/*.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Maven Central mirror for this runner
        # repo.maven.apache.org answers 429 (too many requests) to GitHub's runners, and the Robolectric
        # native runtime jar (nativeruntime-dist-compat) is the one it refused. Google's mirror of Maven
        # Central serves the same files; Gradle checks it first. Only this CI job uses it (an init script
        # in the runner's home), the project's own repositories are unchanged.
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          printf '%s\n' \
            'settingsEvaluated { s ->' \
            '  def repos = s.dependencyResolutionManagement.repositories' \
            '  def m = repos.maven { url = "https://maven-central.storage-download.googleapis.com/maven2/" }' \
            '  repos.remove(m); repos.add(0, m)' \
            '}' | tee "$HOME/.gradle/init.d/central-mirror.gradle"

      - name: On-TV app unit tests
        run: tv-home/android/gradlew -p on-tv/android --no-daemon testDebugUnitTest

      - name: Unit test failures (only when the tests fail)
        if: failure()
        run: |
          for f in on-tv/android/app/build/test-results/testGithubDebugUnitTest/*.xml; do
            [ -f "$f" ] && grep -q "<failure" "$f" && { echo "== $f"; grep -A12 "<failure" "$f" | head -60; }
          done
          true

      - name: Signing fingerprints
        run: for f in dist/*.apk; do echo "$f"; "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$f" | grep -i "SHA-256"; done

      - name: Release APK check
        # one APK per app with every processor inside, the same names, compressed native libraries, one
        # signer (scripts/check-release-apks.py), and that check's own tests. --matter: both on-TV APKs
        # must carry Matter's controller for both ARM processors (it lands with Matter, nl-matter-android)
        run: |
          python tests/test_release_apks.py
          python tests/test_release_script.py
          sh scripts/release-checksums.sh --matter

      - uses: actions/upload-artifact@v4
        with:
          name: couch-tv-test-apks
          path: dist/*.apk
          if-no-files-found: error
