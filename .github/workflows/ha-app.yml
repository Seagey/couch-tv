# Builds the couch-tv Home Assistant app (homeassistant/couch_tv/) as one image per architecture,
# and tests it.
#   - On every push and pull request that touches the app or the bridge: build the amd64 image,
#     start it the way Home Assistant does (a config folder and an options.json) and check that the
#     bridge answers with its pairing key. Nothing is pushed.
#   - When a couch-tv release is published (or this workflow is run by hand with a tag): build the
#     aarch64 and amd64 images from the repo root on native runners (no QEMU) and push them to
#     GitHub's container registry as ghcr.io/<owner>/couch-tv-app-<arch>:<version> and :latest. The
#     version is the release tag without its leading "v". Home Assistant installs from these images:
#     homeassistant/couch_tv/config.yaml names them in "image".
# The first push makes each package private. Make both public once (the repository's Packages page,
# Package settings, Change visibility), or Home Assistant cannot pull them.
#
# Shape adapted from setup-app.yml. Only GitHub's own actions are used, pinned to commits; the
# docker command line does the rest.
name: Home Assistant app

on:
  push:
    paths: ["homeassistant/**", "bridge/**", "remote/**", "tv-home/web/**", "on-tv/web/**", "titan/**", "config.example.json", ".github/workflows/ha-app.yml"]
  pull_request:
    paths: ["homeassistant/**", "bridge/**", "remote/**", "tv-home/web/**", "on-tv/web/**", "titan/**", "config.example.json", ".github/workflows/ha-app.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and push, for example v0.13.17 (leave empty to only test)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - name: Build the image (amd64, not pushed)
        run: docker build -f homeassistant/couch_tv/Dockerfile -t couch-tv-app:ci .

      - name: Start it like Home Assistant does (a key in the options)
        run: |
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/data"
          echo '{"pairing_key":"ci-test-key-123456","ask_engine":"off","ask_agent_id":"","allow_power_off":false}' > "$RUNNER_TEMP/data/options.json"
          docker run -d --name app --network host \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/data:/data" couch-tv-app:ci

      - name: The bridge answers with its pairing key and serves the remote
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ci-test-key-123456" http://127.0.0.1:5400/api/tvs || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          echo "GET /api/tvs with the key: $code"
          [ "$code" = 200 ] || { docker logs app; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5400/api/tvs || true)
          echo "GET /api/tvs without a key: $code"
          [ "$code" = 401 ] || { docker logs app; exit 1; }
          curl -fs http://127.0.0.1:5400/ | grep -qi "<html" || { echo "the phone remote is not served"; exit 1; }
          test -f "$RUNNER_TEMP/config/config.json"
          ! grep -q '"ask"' "$RUNNER_TEMP/config/config.json"

      # Skipped while the bridge has no MCP HTTP mode (run.sh does not start it then).
      - name: The MCP server answers
        run: |
          grep -q COUCH_MCP_HTTP bridge/mcp_server.py || { echo "no MCP HTTP mode in this bridge yet: skipped"; exit 0; }
          H='-H Content-Type:application/json -H Accept:application/json,text/event-stream'
          ok=
          for i in $(seq 1 30); do
            curl -s --max-time 3 $H -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' http://127.0.0.1:5401/mcp | grep -q serverInfo && { ok=1; break; }
            sleep 1
          done
          [ -n "$ok" ] || { echo "the MCP server did not answer on 5401"; docker logs app; exit 1; }

      - name: Start it again with no key in the options (it makes one)
        run: |
          docker rm -f app
          rm -rf "$RUNNER_TEMP/config"; mkdir -p "$RUNNER_TEMP/config"
          echo '{"pairing_key":"","ask_engine":"off","ask_agent_id":"","allow_power_off":false}' > "$RUNNER_TEMP/data/options.json"
          docker run -d --name app --network host \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/data:/data" couch-tv-app:ci
          for i in $(seq 1 30); do [ -s "$RUNNER_TEMP/config/pairing_key" ] && break; sleep 1; done
          key=$(cat "$RUNNER_TEMP/config/pairing_key")
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" http://127.0.0.1:5400/api/tvs || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          echo "GET /api/tvs with the made key: $code"
          [ "$code" = 200 ] || { docker logs app; exit 1; }

      - name: Container log
        if: always()
        run: docker logs app || true

  publish:
    # Only for a published release, or a hand run that names a tag. Waits for the smoke test.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            os: ubuntu-24.04-arm      # native Arm runner, free for public repositories
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Which version
        id: v
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          ref: ${{ steps.v.outputs.tag }}
          persist-credentials: false

      - name: The app's version matches the release
        # Home Assistant only offers an update when config.yaml's version changes, so a release whose
        # tag differs would build an image no one is told about.
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          grep -qx "version: \"$VERSION\"" homeassistant/couch_tv/config.yaml || {
            echo "config.yaml says another version than $VERSION"; exit 1; }

      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Build and push
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.v.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr 'A-Z' 'a-z')/couch-tv-app-$ARCH"
          docker buildx build --provenance=false --platform "$PLATFORM" --push \
            -f homeassistant/couch_tv/Dockerfile \
            --build-arg "BUILD_VERSION=$VERSION" --build-arg "BUILD_ARCH=$ARCH" \
            -t "$image:$VERSION" -t "$image:latest" .
