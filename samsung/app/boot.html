<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Couch TV</title>
<style>html, body { margin: 0; width: 100%; height: 100%; background: #0b0d12; }</style>
</head>
<body>
<script src="settings.js"></script>
<script src="tizen-apps.js"></script>
<script>
// First page of the Samsung app. It asks the bridge for its settings and opens the TV home
// (index.html): live with the bridge, or the home's own offline copy when the computer is off.
// The apps on this TV are read here too, but the home does not wait for them when it already has
// the list from last time (a TV with 491 apps took 6.3 s to give it, #53): tizen.js reads it again
// once the home is up.
(function () {
  "use strict";
  var S = window.COUCH_TIZEN || {};
  var BRIDGE = (S.bridge || "").replace(/\/+$/, "");
  var done = false;

  function go(live) {
    if (done) return;
    done = true;
    var q = [];
    if (S.tv) q.push("tv=" + encodeURIComponent(S.tv));
    if (live) q.push("api=" + encodeURIComponent(BRIDGE));
    else { q.push("offline=1"); if (!BRIDGE) q.push("alone=1"); }
    location.replace("index.html?" + q.join("&"));
  }

  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  // the apps on this TV, for the home's app row. With a list saved from last time the home opens
  // straight away and tizen.js refreshes the list; the first ever open waits for it.
  var haveList = false;
  try { haveList = !!localStorage.getItem("couch.tizen.apps"); } catch (e) {}
  var appsDone = haveList, bridgeAnswer = null;
  function next() { if (appsDone && bridgeAnswer !== null) go(bridgeAnswer); }
  if (!haveList) {
    try {
      tizen.application.getAppsInfo(function (list) {
        store("couch.tizen.apps", JSON.stringify(list.map(function (a) {
          return { id: a.id, name: a.name, packageId: a.packageId, iconPath: a.iconPath, show: a.show };
        })));
        appsDone = true; next();
      }, function () { appsDone = true; next(); });
    } catch (e) { appsDone = true; }
  }

  // the bridge's settings (people, weather place, the look), kept for when it is off
  if (!BRIDGE) bridgeAnswer = false;
  else {
    var x = new XMLHttpRequest();
    x.open("GET", BRIDGE + "/tv/config.js" + (S.tv ? "?tv=" + encodeURIComponent(S.tv) : ""));
    x.timeout = 4000;
    x.onload = function () {
      if (x.status === 200 && /COUCH_CONFIG/.test(x.responseText)) { store("couch.configjs", x.responseText); bridgeAnswer = true; }
      else bridgeAnswer = false;
      next();
    };
    x.onerror = x.ontimeout = function () { bridgeAnswer = false; next(); };
    x.send();
  }
  next();
  setTimeout(function () { go(bridgeAnswer === true); }, 15000);   // never stuck on a black screen
})();
</script>
</body>
</html>
