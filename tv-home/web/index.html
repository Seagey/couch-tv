<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Home</title>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<!-- Night look only: five scenes that take turns (photo, glass clock, the cut-out in front), built by app.js -->
<!-- the video background, when one is set (Home settings, Look): app.js starts it, app.css shows it
     once it plays. Over the photo, under the scenes' clocks (their photos step aside for it). -->
<video class="bgvid" id="bgvid" muted loop playsinline preload="none" aria-hidden="true"></video>
<div class="scenes" id="scenes" aria-hidden="true"></div>
<!-- Ambient Weather & Solar Celestial Lighting Overlays -->
<div class="ambient-lighting" id="ambient-lighting" aria-hidden="true"></div>
<canvas class="weather-canvas" id="weather-canvas" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>

<header class="top">
  <div class="top-left">
    <div class="people-wrap">
      <div class="people" id="people"></div>
      <!-- three or more people: the list the head icon opens -->
      <div class="people-pop" id="people-pop" role="listbox" aria-label="Who is watching"></div>
    </div>
    <div class="hero" id="hero" aria-live="polite">
      <h1 id="hero-title"></h1>
      <p id="hero-sub"></p>
    </div>
  </div>
  <div class="clock">
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>
    <div class="place" id="place"></div>
    <div class="quick" id="quick">
      <!-- the quick buttons from tvs[].quick in config.json, drawn by app.js -->
      <div class="qbtns" id="qbtns"></div>
      <div class="sleep-menu" id="sleep-menu"></div>
    </div>
    <p class="quick-note" id="quick-note"></p>
    <!-- Now playing (#31): the song any app is playing behind the home, drawn by app.js. Top right,
         under the quick buttons, where no scene puts its clock -->
    <div class="np" id="np" aria-live="polite"></div>
  </div>
</header>

<!-- Ambient Music Art Screen: large album cover, dynamic ambient backlight, and remote media controls -->
<div class="ambient-music" id="ambient-music" aria-live="polite">
  <div class="ambient-glow" id="ambient-glow"></div>
  <div class="ambient-stage" id="ambient-stage">
    <div class="ambient-art-wrap" id="ambient-art-wrap">
      <img class="ambient-art" id="ambient-art" src="" alt="" decoding="async">
      <div class="ambient-art-fallback" id="ambient-art-fallback"></div>
      <div class="ambient-vinyl" id="ambient-vinyl"></div>
    </div>
    <div class="ambient-meta">
      <span class="ambient-app" id="ambient-app"></span>
      <h1 class="ambient-title" id="ambient-title"></h1>
      <p class="ambient-artist" id="ambient-artist"></p>
      <div class="ambient-wave" id="ambient-wave" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="ambient-progress" id="ambient-progress">
        <span class="ambient-time ambient-time-cur" id="ambient-time-cur">0:00</span>
        <div class="ambient-bar-track">
          <div class="ambient-bar-fill" id="ambient-bar-fill"></div>
        </div>
        <span class="ambient-time ambient-time-total" id="ambient-time-total">0:00</span>
      </div>
      <div class="ambient-controls" id="ambient-controls">
        <span class="amb-btn" id="amb-prev" role="button" aria-label="Previous"></span>
        <span class="amb-btn" id="amb-play" role="button" aria-label="Play or Pause"></span>
        <span class="amb-btn" id="amb-next" role="button" aria-label="Next"></span>
        <span class="amb-btn amb-btn-open" id="amb-open" role="button" aria-label="Open App"></span>
      </div>
      <p class="ambient-hint" id="ambient-hint"></p>
    </div>
  </div>
</div>
<!-- a short confirmation, for something that happened by itself (the weekly Developer Mode extend) -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main class="home">
  <section class="shelf" id="shelf-section" aria-labelledby="shelf-title">
    <header class="shelf-head">
      <h2 id="shelf-title">Keep watching</h2>
      <p class="status" id="status"></p>
    </header>
    <!-- Night look: Now playing (#31) moves into this slot, the first card of the row -->
    <div class="shelf-row"><div class="np-slot" id="np-slot"></div><div class="shelf-clip"><div class="shelf-track" id="shelf"></div></div></div>
  </section>

  <section class="apps" id="apps-section" aria-label="Apps">
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<!-- the gear tile's menu (Home settings or TV settings), drawn by app.js -->
<div class="gear-pop" id="gear-pop" role="menu"></div>

<!-- hold OK on an app: a small menu (move, hide, uninstall, app info), drawn by app.js -->
<div class="app-pop" id="app-pop" role="menu"></div>
<!-- the Input button's menu: the TV's inputs, then Bluetooth and Network (#30), drawn by app.js -->
<div class="app-pop" id="inputs-pop" role="menu"></div>

<!-- Home settings: couch-tv's own settings screen, drawn by app.js ("home settings") -->
<div class="settings" id="settings" role="dialog" aria-modal="true" aria-label="Home settings">
  <div class="set-side">
    <h1 class="set-title" id="set-title"></h1>
    <div class="set-secs" id="set-secs"></div>
  </div>
  <div class="set-main">
    <p class="set-crumb" id="set-crumb"></p>
    <h2 class="set-head" id="set-head"></h2>
    <div class="set-type" id="set-type">
      <label class="set-type-label" id="set-type-label" for="set-input"></label>
      <input id="set-input" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="set-rows" id="set-rows"></div>
    <p class="set-msg" id="set-msg" aria-live="polite"></p>
    <p class="set-hint" id="set-hint"></p>
  </div>
</div>

<!-- Smart home (optional): the rooms and scenes screen, drawn by smarthome.js -->
<div class="smart" id="smart" role="dialog" aria-modal="true" aria-label="Smart home"></div>

<!-- Night dim: amber bedtime overlay when sleep timer is near zero -->
<div class="bedtime-overlay" id="bedtime-overlay" aria-hidden="true"></div>

<!-- OLED-safe idle ambient clock overlay -->
<div class="idle-ambient-overlay" id="idle-ambient-overlay" aria-hidden="true">
  <div class="idle-ambient-inner" id="idle-ambient-inner">
    <div class="idle-clock" id="idle-clock"></div>
    <div class="idle-date" id="idle-date"></div>
    <div class="idle-wx" id="idle-wx"></div>
    <div class="idle-wake-hint" id="idle-wake-hint"></div>
  </div>
</div>

<!-- Screen off / Audio-only blackout overlay -->
<div class="screen-off-overlay" id="screen-off-overlay" aria-hidden="true">
  <div class="screen-off-hint" id="screen-off-hint"></div>
</div>

<script src="i18n.js"></script>
<script src="config.js"></script>
<script src="smarthome.js"></script>
<script src="soundscape.js"></script>
<script src="clearicon.js"></script>
<script src="ambient-weather.js"></script>
<script src="vega.js"></script>
<script src="kids.js"></script>
<script src="spotify-player.js"></script>
<script src="app.js"></script>
</body>
</html>
