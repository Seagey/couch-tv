<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Couch TV</title>
<style>html, body { margin: 0; width: 100%; height: 100%; background: #0b0d12; }</style>
</head>
<body>
<script src="settings.js"></script>
<script src="webos-apps.js"></script>
<script src="webos-tv-apps.js"></script>
<script>
// First page of the LG app. It notes which apps this TV has (the home page needs the list
// straight away), asks the bridge for its settings, then opens the TV home (index.html): live
// with the bridge, or the home's own offline copy when the computer is off.
//
// The app list: webOS may refuse an app's own request for it (listLaunchPoints is not one of the
// calls LG documents for apps), so the bridge's copy (/api/webos/apps, read over LG's network
// remote) is asked for too, and the last good list is kept for when the computer is off. With no
// bridge, a list baked in at build time (lg/build.py --apps, webos-tv-apps.js) seeds it once per
// build, so the dock is not empty on firmware that refuses the list (webOS 5.6.2, 6.5.3).
(function () {
  "use strict";
  var S = window.COUCH_WEBOS || {};
  var BRIDGE = (S.bridge || "").replace(/\/+$/, "");
  var done = false;

  function go(live) {
    if (done) return;
    done = true;
    var q = [];
    if (S.tv) q.push("tv=" + encodeURIComponent(S.tv));
    if (live) q.push("api=" + encodeURIComponent(BRIDGE));
    else { q.push("offline=1"); if (!BRIDGE) q.push("alone=1"); }
    location.replace("index.html?" + q.join("&"));
  }

  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function keepApps(list) {
    store("couch.webos.apps", JSON.stringify(list.map(function (a) {
      return { id: a.id, title: a.title, icon: a.icon || a.largeIcon || null };
    })));
  }

  // the apps on this TV, for the home's app row: the baked list, then the TV, then the bridge
  var BAKED = window.COUCH_WEBOS_TV_APPS || [];
  var BAKED_V = window.COUCH_WEBOS_TV_APPS_VERSION || "";
  try {
    if (BAKED.length && localStorage.getItem("couch.webos.apps.v") !== BAKED_V) {
      keepApps(BAKED);
      store("couch.webos.apps.v", BAKED_V);
    }
  } catch (e) {}
  var appsDone = false, appsFromTv = false, bridgeAnswer = null;
  function next() { if (appsDone && bridgeAnswer !== null) go(bridgeAnswer); }
  var held = [];   // a service call is lost if nothing holds on to it until it answers
  try {
    var b = new PalmServiceBridge();
    held.push(b);
    b.onservicecallback = function (msg) {
      var r = null;
      try { r = JSON.parse(msg); } catch (e) {}
      if (r && r.returnValue && r.launchPoints && r.launchPoints.length) { keepApps(r.launchPoints); appsFromTv = true; }
      appsDone = true; next();
    };
    b.call("luna://com.webos.applicationManager/listLaunchPoints", "{}");
  } catch (e) { appsDone = true; }
  setTimeout(function () { appsDone = true; next(); }, 2500);

  // the bridge's settings (people, weather place, the look), kept for when it is off
  if (!BRIDGE) bridgeAnswer = false;
  else {
    var x = new XMLHttpRequest();
    x.open("GET", BRIDGE + "/tv/config.js" + (S.tv ? "?tv=" + encodeURIComponent(S.tv) : ""));
    x.timeout = 4000;
    x.onload = function () {
      if (x.status === 200 && /COUCH_CONFIG/.test(x.responseText)) { store("couch.configjs", x.responseText); bridgeAnswer = true; }
      else bridgeAnswer = false;
      next();
    };
    x.onerror = x.ontimeout = function () { bridgeAnswer = false; next(); };
    x.send();
    var y = new XMLHttpRequest();
    y.open("GET", BRIDGE + "/api/webos/apps" + (S.tv ? "?tv=" + encodeURIComponent(S.tv) : ""));
    if (S.key) y.setRequestHeader("Authorization", "Bearer " + S.key);
    y.timeout = 4000;
    y.onload = function () {
      var list = null;
      try { list = JSON.parse(y.responseText).apps; } catch (e) {}
      if (!appsFromTv && list && list.length) keepApps(list);
    };
    y.send();
  }
  next();
  setTimeout(function () { go(bridgeAnswer === true); }, 6000);   // never stuck on a black screen
})();
</script>
</body>
</html>
